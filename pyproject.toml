[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "roi-calculator"
version = "1.0.1"
description = "Windows desktop ROI calculator for e-commerce advertising"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7", "Pillow>=10,<12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
